# Build on GitHub, deploy to cPanel.
#
# The server cannot build this site: its glibc is 2.28 and Next.js needs 2.29
# for the native compiler, so it falls back to WebAssembly and exhausts the
# account's process allowance mid-build. See docs/HOSTING_REQUEST_EN.md.
#
# So the build happens here, on a machine that can do it, and only the finished
# artefact is shipped. That also makes the platform right by construction: this
# runner is linux-x64, like the server, so the native modules that end up in the
# standalone tree are the ones the server can load.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. The server takes a lock too, but queuing here means
# a second push waits rather than failing on the lock.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: https://nuruzzaman.com.bd
  NEXT_PUBLIC_API_BASE: /api/v1
  NEXT_PUBLIC_SESSION_COOKIE: nuruzzaman_session
  NEXT_PUBLIC_MEDIA_HOST: api.nuruzzaman.com.bd
  INTERNAL_API_URL: https://api.nuruzzaman.com.bd/api/v1
  NB_API_PROXY: https://api.nuruzzaman.com.bd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The deployment refuses an artefact that cannot be traced to the commit
      # being deployed, so the build stamps itself.
      - name: Stamp the build with this commit
        run: echo "${{ github.sha }}" > apps/web/.next/nb-commit

      - name: Package the build
        run: |
          cd apps/web
          tar -czf "$RUNNER_TEMP/web-build.tar.gz" \
            .next/standalone .next/static .next/BUILD_ID \
            .next/routes-manifest.json .next/nb-commit public
          ls -lh "$RUNNER_TEMP/web-build.tar.gz"

      - name: Authorise SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # A missing secret otherwise surfaces as an unreadable scp error, so
          # each one is named here. The result also goes to the run summary,
          # which is readable from the run page without opening the log.
          # Values are never printed - only whether they are set.
          missing=0
          {
            echo '### Deployment secrets'
            echo
            echo '| Secret | Status |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "MISSING secret: $name"
              echo "| \`$name\` | **MISSING** |" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "present: $name"
              echo "| \`$name\` | set |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$missing" != 0 ]; then
            {
              echo
              echo 'Add the missing ones under **Settings -> Secrets and variables -> Actions**,'
              echo 'on the **Secrets** tab. The Variables tab sits beside it and looks the same,'
              echo 'but a value stored there is not readable as a secret.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Carriage returns are stripped. A key copied from a file on Windows
          # carries CRLF line endings; ssh-keygen then rejects it as unreadable
          # while the secret looks perfectly correct in the GitHub UI.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no, so a swapped
          # server is an error instead of a silent success. The keys are public
          # and live in the repository; the secret only exists to override them
          # without a commit, should the host ever change its keys.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
            echo 'host keys: from the DEPLOY_KNOWN_HOSTS secret'
          else
            tr -d '\r' < infra/cpanel/known_hosts > ~/.ssh/known_hosts
            echo 'host keys: from infra/cpanel/known_hosts'
          fi
          chmod 600 ~/.ssh/known_hosts

          echo "key lines: $(wc -l < ~/.ssh/id_deploy), known_hosts lines: $(wc -l < ~/.ssh/known_hosts)"
          head -1 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null \
            || { echo 'The private key is not readable. Copy the whole file including the BEGIN and END lines, and make sure it is the private key (nb_github_deploy) rather than the .pub one.'; exit 1; }

      - name: Check the server accepts the key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Separated from the upload so an authentication problem is not
          # reported as a file-transfer problem.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=25 \
            -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'echo connected as $(whoami)' \
            || { echo; echo 'SSH refused. Check that the public key is AUTHORIZED in cPanel (Import and Authorize are two separate steps), and that DEPLOY_KNOWN_HOSTS matches this host and port.'; exit 1; }

      - name: Upload the build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/web-build.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:nb-incoming.tar.gz"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # The commit is passed as an argument, not interpolated into the
          # script: the heredoc is quoted so that nothing in it is expanded by
          # the runner's shell before it reaches the server.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- ${{ github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          REPO="$HOME/repositories/nuruzzaman-com-bd"
          BUILD="$HOME/nb-build"

          # Match the server's checkout to the commit being deployed. The
          # deployment reads the commit from here, and it must agree with the
          # stamp inside the artefact or the build check rejects it.
          git -C "$REPO" fetch --quiet origin main
          git -C "$REPO" reset --quiet --hard "$SHA"
          git -C "$REPO" clean -qfd

          rm -rf "$BUILD"
          mkdir -p "$BUILD/apps/web"
          tar -xzf "$HOME/nb-incoming.tar.gz" -C "$BUILD/apps/web"
          rm -f "$HOME/nb-incoming.tar.gz"

          # Web only, and no build: the artefact is already here. Written fresh
          # each run so a stale file cannot change what gets deployed.
          cat > "$HOME/.nb-deploy.ci.conf" <<CONF
          . "\$HOME/.nb-deploy.conf"
          NB_DEPLOY_API=0
          NB_BUILD_WEB=0
          NB_WEB_BUILD_ROOT="$BUILD"
          CONF

          cd "$REPO"
          NB_DEPLOY_SOURCE="$PWD" NB_DEPLOY_CONFIG="$HOME/.nb-deploy.ci.conf" \
            bash infra/cpanel/deploy.sh

          # Next caches API responses on disk; without this a content change
          # can sit invisible behind the old cache after a deploy.
          rm -rf "$HOME/nuruzzaman-web/current/apps/web/.next/cache"
          touch "$HOME/nuruzzaman-web/tmp/restart.txt"
          REMOTE

      - name: Verify the site is actually serving
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Checked from the server, not from this runner.
          #
          # The host answers addresses it does not recognise with a
          # bot-protection interstitial: "One moment, please...", HTTP 200,
          # HTML, for every path - the JSON API included. Seen from a runner
          # that is being challenged, a healthy site and a broken one are
          # identical, and this step failed a deploy that was perfectly fine.
          #
          # An outside prober would be the better vantage point, but only if it
          # can tell the site's answer from the challenge, and from here it
          # cannot. The server's own address is not challenged, so the checks
          # run there, over the connection the deploy already uses.
          #
          # The commit is passed as an argument rather than interpolated: the
          # heredoc is quoted so nothing in it is expanded before it lands.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=25 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- ${{ github.sha }}" <<'REMOTE'
          set -u
          SHA="$1"
          SHORT=$(printf '%s' "$SHA" | cut -c1-12)
          SITE=https://nuruzzaman.com.bd
          failed=0

          # Passenger starts the app on the first request, so this warms it too.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$SITE/" || echo 000)
            [ "$code" = 200 ] && break
            echo "attempt $attempt: HTTP $code - waiting"
            sleep 10
          done

          check() {
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$1" || echo 000)
            if [ "$actual" = "$2" ]; then
              printf 'PASS %-44s %s\n' "${1#$SITE}" "$actual"
            else
              printf 'FAIL %-44s %s (expected %s)\n' "${1#$SITE}" "$actual" "$2"
              failed=1
            fi
            sleep 2
          }

          # Matched against a lowercased body, so the needles hold however Next
          # chooses to case an attribute (it emits hrefLang, not hreflang).
          assert_contains() {
            for attempt in 1 2 3; do
              if curl -s --max-time 90 "$1" | tr 'A-Z' 'a-z' | grep -qF "$2"; then
                printf 'PASS %-44s contains %s\n' "${1#$SITE}" "$2"
                return 0
              fi
              sleep 5
            done
            printf 'FAIL %-44s missing %s\n' "${1#$SITE}" "$2"
            failed=1
          }

          check "$SITE/"                      200
          check "$SITE/en"                    200
          check "$SITE/courses"               200
          check "$SITE/blog"                  200
          check "$SITE/api/v1/site/settings"  200
          check "$SITE/sanctum/csrf-cookie"   204

          # Rendered by our own metadata, so an interstitial cannot satisfy them.
          assert_contains "$SITE/"   'rel="canonical"'
          assert_contains "$SITE/en" 'hreflang="en"'

          # Laravel answering through the proxy, rather than HTML with a 200.
          type=$(curl -s -o /dev/null -w '%{content_type}' --max-time 90 "$SITE/api/v1/site/settings" || echo none)
          case "$type" in
            application/json*) printf 'PASS %-44s %s\n' '/api/v1/site/settings' "$type" ;;
            *) printf 'FAIL %-44s %s (expected JSON)\n' '/api/v1/site/settings' "$type"; failed=1 ;;
          esac

          # And that the site serving all that is this commit - not the previous
          # release still answering happily while the new one failed to take.
          live=$(basename "$(readlink "$HOME/nuruzzaman-web/current" || echo none)")
          case "$live" in
            *"$SHORT"*) printf 'PASS %-44s %s\n' 'live release is this commit' "$live" ;;
            *) printf 'FAIL %-44s %s\n' "live release is not $SHORT" "$live"; failed=1 ;;
          esac

          exit "$failed"
          REMOTE
