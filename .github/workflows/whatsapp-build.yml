name: WhatsApp inbox CI
on:
  push:
    branches: [release/whatsapp-bot-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-inbox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devroot
          MYSQL_DATABASE: nuruzzaman_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdevroot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Backend feature tests
        working-directory: apps/api
        run: |
          composer install --no-interaction --prefer-dist --no-scripts
          cp .env.example .env
          php artisan key:generate --no-interaction
          php vendor/bin/phpunit tests/Feature/WhatsAppMessagingTest.php tests/Feature/WhatsAppCallingTest.php tests/Feature/WhatsAppOperationsTest.php tests/Feature/CheckoutTest.php tests/Feature/NotificationEventsTest.php

      - name: Install frontend dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Frontend unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Contract types
        run: npm run contracts:types

      - name: Typecheck
        run: npm run typecheck

      - name: Secretless production build
        run: npm run build
