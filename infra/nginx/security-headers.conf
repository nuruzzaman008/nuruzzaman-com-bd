# Headers applied to every response from this origin.
#
# The CSP is deliberately compatible with the SSLCOMMERZ hosted page and the
# video providers. Roll it out in report-only first (swap the header name for
# Content-Security-Policy-Report-Only), read the reports, then enforce.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enable once HTTPS is verified end to end, including every subdomain.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header Content-Security-Policy "\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'self'; \
form-action 'self' https://securepay.sslcommerz.com https://sandbox.sslcommerz.com; \
img-src 'self' data: blob: https:; \
font-src 'self' data:; \
style-src 'self' 'unsafe-inline'; \
script-src 'self' 'unsafe-inline'; \
connect-src 'self'; \
media-src 'self' https:; \
frame-src 'self' https://player.vimeo.com https://iframe.mediadelivery.net; \
worker-src 'self' blob:; \
upgrade-insecure-requests" always;
