# Single public origin.
#
# The browser only ever sees https://nuruzzaman.com.bd, which is what keeps the
# Sanctum session a first-party cookie and removes the need for CORS in
# production. Nginx decides which upstream serves each path:
#
#   /api/*, /sanctum/*, /storage/*, /up   -> Laravel (PHP-FPM)
#   everything else                       -> Next.js (Node)

upstream php_upstream {
    server api:9000;
}

upstream next_upstream {
    server web:3000;
}

# Protects the endpoints worth protecting even before they reach the app.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 1024M;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.conf;

    # The real client address for Laravel rate limiting and audit rows.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- Laravel
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        # Public media only. Protected installers live on a private disk and are
        # never reachable through the web root.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /sanctum/ {
        limit_req zone=auth_zone burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Streamed downloads can take a while on a slow connection.
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # No other PHP file is executable from the web root.
    location ~ \.php$ {
        return 404;
    }

    # ---------------------------------------------------------------- Next.js
    location /_next/static/ {
        proxy_pass http://next_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
