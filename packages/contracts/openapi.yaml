  /admin/users/{user}/mfa/reset:
    post:
      tags: [Admin]
      operationId: adminResetStaffTwoFactor
      summary: Reset another staff member's two-step verification
      security: [{ sessionCookie: [] }]
      description: |
        Super admins may reset any other staff account; admins any other staff
        account except a super admin's. Never the acting account, never a
        customer. Needs the acting person's own current authenticator code,
        which works once; three wrong codes lock it for fifteen minutes. The
        account that was reset is emailed.
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 10, description: "The acting person's own six-digit code" }
      responses:
        '200':
          description: Two-step verification cleared; they set it up again on their next dashboard visit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{user}/roles:
    put:
      tags: [Admin]
      operationId: adminSyncUserRoles
      summary: Admin sync user roles
      security: [{ sessionCookie: [] }]
      description: |
        Super admins only, and never on the acting account. Requires a recent
        password confirmation; otherwise the response is 423.
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: string
                    enum: [super_admin, admin, editor, instructor, support, student, customer]
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423':
          description: Password confirmation required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/seo/keyword-usage:
    get:
