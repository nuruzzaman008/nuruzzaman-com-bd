                index: { type: integer, minimum: 0, maximum: 199 }
                chunk: { type: string, format: binary }
      responses:
        '201':
          description: Part stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [received]
                    properties:
                      received: { type: integer }
