  /learn/{courseSlug}/outline:
    get:
      tags: [Learn]
      operationId: getCourseOutline
      summary: Get course outline
      security: [{ sessionCookie: [] }]
      description: Curriculum plus this learner's own unlock and completion state.
      parameters:
        - { name: courseSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [course, enrollment, sections]
                    properties:
                      course:
                        type: object
                        required: [slug, title, sequential, issues_certificate]
                        properties:
                          slug: { type: string }
                          title: { type: string }
                          sequential: { type: boolean }
                          issues_certificate: { type: boolean }
                      enrollment:
                        type: object
                        required: [status, progress_percent]
                        properties:
                          status: { type: string }
                          progress_percent: { type: integer }
                          expires_at: { type: [string, 'null'], format: date-time }
                          last_lesson_id: { type: [integer, 'null'] }
                      sections:
                        type: array
                        items:
                          type: object
                          required: [id, title, lessons]
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            lessons:
                              type: array
                              items:
                                type: object
                                required: [slug, title, type, duration_seconds, is_completed, is_unlocked]
                                properties:
                                  slug: { type: string }
                                  title: { type: string }
                                  type: { type: string }
                                  duration_seconds: { type: [integer, 'null'] }
                                  is_completed: { type: boolean }
                                  is_unlocked: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learn/{courseSlug}/lessons/{lessonSlug}:
    get:
      tags: [Learn]
      operationId: getLesson
      summary: Get lesson
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: courseSlug, in: path, required: true, schema: { type: string } }
        - { name: lessonSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lesson' }
        '403':
          description: Not enrolled, or the lesson is still locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /learn/{courseSlug}/lessons/{lessonSlug}/heartbeat:
    post:
      tags: [Learn]
      operationId: reportLessonProgress
      summary: Report lesson progress
      security: [{ sessionCookie: [] }]
      description: |
        Reports how far into a lesson the learner has reached. Values are clamped
        to the lesson duration and never move progress backwards. The client
        cannot report a course completion percentage.
      parameters:
        - { name: courseSlug, in: path, required: true, schema: { type: string } }
        - { name: lessonSlug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched_seconds]
              properties:
                watched_seconds: { type: integer, minimum: 0, maximum: 86400 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /learn/{courseSlug}/lessons/{lessonSlug}/complete:
    post:
      tags: [Learn]
      operationId: completeLesson
