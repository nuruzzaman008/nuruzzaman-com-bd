      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  /auth/reset-password:
    post:
