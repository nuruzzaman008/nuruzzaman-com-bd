openapi: 3.1.0

info:
  title: nuruzzaman.com.bd API
  version: 1.0.0
  description: |
    First-party API for nuruzzaman.com.bd.

    Authentication is a Laravel Sanctum cookie session, not a bearer token: the
    browser calls `GET /sanctum/csrf-cookie` once, then sends the `XSRF-TOKEN`
    value back in the `X-XSRF-TOKEN` header on every mutating request. Nothing
    is stored in `localStorage`.

    Money is always an integer in minor units (1 BDT = 100 poisha). A `null`
    price means the owner has not published one yet and the UI must render an
    honest "contact for price" state rather than zero.

    Every error uses the same envelope, so one client-side handler covers the
    whole surface.
  contact:
    name: Engr. Md. Nuruzzaman, RSE
  license:
    name: Proprietary

servers:
  - url: https://nuruzzaman.com.bd/api/v1
    description: Production (same origin, proxied to Laravel by Nginx)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
    description: First-party cookie session, email verification and password reset.
  - name: Site
    description: Owner-configured values, sitemap feed, redirects and search.
  - name: Content
    description: Published articles, pages, categories and authors.
  - name: Catalog
    description: Products, variants, published prices and release metadata.
  - name: Courses
    description: Public course landing data, free preview lessons and certificate checks.
  - name: Cart
    description: Server-priced cart for anonymous visitors and signed-in customers.
  - name: Checkout
    description: Order creation and gateway session hand-off.
  - name: Payments
    description: Gateway callbacks and read-only payment status.
  - name: Account
    description: The signed-in customer's own orders, downloads, licences and requests.
  - name: Learn
    description: The authenticated course player, progress, quizzes and assignments.
  - name: Admin
    description: Staff surface for content, commerce, LMS, support and settings.

security: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuruzzaman_session
      description: First-party Sanctum session cookie set by /api/v1/auth/login.

  parameters:
    Locale:
      name: locale
      in: query
      description: >-
        Language for titles, summaries and CMS bodies. Defaults to Bengali.
        Where no English text has been written the Bengali is returned and a
        translation flag on the payload says so. A query parameter rather than
        Accept-Language, so a response cannot be cached under the wrong
        language.
      schema: { type: string, enum: [bn, en] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a payment-sensitive mutation safe to retry. Repeating the same key
        with the same body replays the stored response; reusing it with a
        different body is a 409.
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such resource, or it is not published
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: Field-level validation errors
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - gone
                - locked
                - rate_limited
                - bad_request
                - request_failed
                - server_error
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }

    Pagination:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Money:
      type: object
      description: An amount in integer minor units.
      required: [currency, amount_minor]
      properties:
        currency: { type: string, examples: ['BDT'] }
        amount_minor: { type: integer, minimum: 0 }
        compare_at_minor: { type: [integer, 'null'], minimum: 0 }
        offer_ends_at:
          description: When a discounted price stops applying; null when it is not a time-limited offer.
          type: [string, 'null']
          format: date-time

    FreeEnrollmentResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [course_slug, status, learn_url]
          properties:
            course_slug: { type: string }
            status: { type: string }
            learn_url: { type: string }

    CoursePricingWrite:
      type: object
      description: |
        A course's price as the editor sets it: free, or a regular price with an
        optional offer that ends at offer_ends_at, after which the regular price
        applies again by itself.
      required: [type]
      properties:
        type: { type: string, enum: [free, paid] }
        regular_minor: { type: integer, minimum: 1 }
        offer_minor: { type: [integer, 'null'], minimum: 1 }
        offer_ends_at: { type: [string, 'null'], format: date-time }

    Author:
      type: object
      required: [slug, name, credentials, headline, bio, same_as, is_reviewer]
      properties:
        slug: { type: string }
        name: { type: string }
        credentials: { type: [string, 'null'] }
        headline: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'] }
        same_as:
          type: array
          items: { type: string }
        is_reviewer: { type: boolean }

    Category:
      type: object
      required: [slug, name, description]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        posts_count: { type: integer }

    Tag:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    Seo:
      type: object
      required: [meta_title, meta_description, canonical_url, noindex, nofollow]
      properties:
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        focus_keyword:
          type: [string, 'null']
          description: >-
            The phrase the page is written to rank for. Every check in the
            editor's SEO analysis is measured against it.
        canonical_url: { type: [string, 'null'] }
        og_image_url: { type: [string, 'null'] }
        noindex: { type: boolean }
        nofollow: { type: boolean }

    TocEntry:
      type: object
      required: [level, text, id]
      properties:
        level: { type: integer }
        text: { type: string }
        id: { type: string }

    PostSummary:
      type: object
      required: [slug, title, excerpt, reading_minutes, published_at, updated_at]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        cover_url: { type: [string, 'null'] }
        cover_alt: { type: [string, 'null'] }
        reading_minutes: { type: integer }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        author: { $ref: '#/components/schemas/Author' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    Post:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required:
            [id, status, body_html, body_translated, toc, funnel_stage, reviewed_at]
          properties:
            id: { type: integer }
            body_translated:
              type: boolean
              description: >-
                False when locale=en was asked for. Titles and summaries have an
                English form; article bodies do not, because they carry load
                figures, bar spacings and code clauses.
            comment_count:
              type: integer
              description: Approved comments only.
            rating:
              description: >-
                Averaged over approved comments that carry a rating. Null until at
                least one exists, so a page can never show a score nobody gave.
              oneOf:
                - type: 'null'
                - type: object
                  required: [average, count]
                  properties:
                    average: { type: number }
                    count: { type: integer }
            status:
              type: string
              enum: [draft, in_review, scheduled, published, archived]
            body_html:
              type: string
              description: Markdown rendered on the server with raw HTML stripped.
            body_markdown:
              type: string
              description: |
                The Markdown source, included only for a user who may read
                drafts. The admin editor loads this; public readers never see it.
            toc:
              type: array
              items: { $ref: '#/components/schemas/TocEntry' }
            funnel_stage: { type: [string, 'null'] }
            reviewed_at: { type: [string, 'null'], format: date-time }
            reviewer: { $ref: '#/components/schemas/Author' }
            tags:
              type: array
              items: { $ref: '#/components/schemas/Tag' }
            seo: { $ref: '#/components/schemas/Seo' }

    Page:
      type: object
      required:
        [id, status, slug, title, body_html, translated, toc, template,
         awaiting_legal_review, legal_reviewer, legal_reviewed_at, published_at,
         updated_at]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [draft, in_review, scheduled, published, archived]
        slug: { type: string }
        title: { type: string }
        body_html: { type: string }
        translated:
          type: boolean
          description: >-
            False when locale=en was asked for but no `<slug>-en` document
            exists, so this is the Bengali page.
        body_markdown:
          type: string
          description: Markdown source; only included for users who may edit pages.
        toc:
          type: array
          items: { $ref: '#/components/schemas/TocEntry' }
        template: { type: string, enum: [default, legal, support] }
        awaiting_legal_review:
          type: boolean
          description: When true the page renders a visible DRAFT notice.
        legal_reviewer: { type: [string, 'null'] }
        legal_reviewed_at: { type: [string, 'null'], format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        seo: { $ref: '#/components/schemas/Seo' }

    ProductVariant:
      type: object
      required: [id, sku, name, description, credit_amount, license_term_days, device_limit, access_duration_days, price, is_purchasable]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        credit_amount: { type: [integer, 'null'] }
        license_term_days: { type: [integer, 'null'] }
        device_limit: { type: [integer, 'null'] }
        access_duration_days: { type: [integer, 'null'] }
        course_slug: { type: [string, 'null'] }
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Null when no price has been published yet.
        is_active: { type: boolean }
        is_purchasable: { type: boolean }

    ProductSummary:
      type: object
      required: [slug, type, name, tagline, variant_count]
      properties:
        slug: { type: string }
        type:
          type: string
          enum: [software_license, credit_refill, course, bundle, digital_resource]
        name: { type: string }
        tagline: { type: [string, 'null'] }
        cover_url: { type: [string, 'null'] }
        from_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        variant_count: { type: integer }

    Product:
      type: object
      required:
        [slug, type, name, tagline, description_html, copy_translated, feature_groups, specs,
         published_at]
      properties:
        id:
          type: integer
          description: Returned to staff only; the public API is addressed by slug.
        slug: { type: string }
        type: { type: string }
        name: { type: string }
        tagline: { type: [string, 'null'] }
        description_html: { type: string }
        copy_translated:
          type: boolean
          description: >-
            False when locale=en was asked for but no English copy exists, so the
            Bengali text is what is being returned.
        cover_url: { type: [string, 'null'] }
        cover_alt: { type: [string, 'null'] }
        feature_groups:
          type: array
          items: { type: string }
        specs:
          type: object
          additionalProperties: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        published_at: { type: [string, 'null'], format: date-time }
        seo: { $ref: '#/components/schemas/Seo' }

    PostComment:
      type: object
      required: [id, author_name, body, rating, created_at]
      properties:
        id: { type: integer }
        author_name: { type: string }
        body: { type: string }
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Null when the reader commented without scoring the article.
        created_at: { type: [string, 'null'], format: date-time }
        status:
          type: string
          enum: [pending, approved, rejected, spam]
          description: Returned to moderators only; a reader only ever receives approved rows.
        post:
          description: Returned to moderators only, so the queue can say which article.
          type: object
          properties:
            slug: { type: string }
            title: { type: string }

    LessonSummary:
      type: object
      required: [slug, title, type, duration_seconds, is_free_preview, position]
      properties:
        slug: { type: string }
        title: { type: string }
        type: { type: string, enum: [text, video, download, quiz, assignment] }
        duration_seconds: { type: [integer, 'null'] }
        is_free_preview: { type: boolean }
        position: { type: integer }

    CourseSection:
      type: object
      required: [id, title, summary, position, drip_days, lessons]
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: [string, 'null'] }
        position: { type: integer }
        drip_days: { type: [integer, 'null'] }
        lessons:
          type: array
          items: { $ref: '#/components/schemas/LessonSummary' }

    CourseReview:
      type: object
      required: [id, title, body, is_verified_enrollment, author_name, published_at]
      properties:
        id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        is_verified_enrollment: { type: boolean }
        author_name: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }

    CourseSummary:
      type: object
      required: [slug, title, subtitle, level, language, estimated_minutes, issues_certificate, published_at]
      properties:
        id:
          type: integer
          description: Returned to staff only; the public API is addressed by slug.
        slug: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        track:
          type: [string, 'null']
          description: Catalogue subject track. Drives browsing and the generated cover art.
        track_name: { type: [string, 'null'] }
        language: { type: string }
        cover_url: { type: [string, 'null'] }
        estimated_minutes: { type: [integer, 'null'] }
        lesson_count: { type: integer }
        issues_certificate: { type: boolean }
        from_price:
          description: >-
            The lowest published price, or null when the owner has not set one -
            in which case the card says so in words rather than showing a figure.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        published_at: { type: [string, 'null'], format: date-time }

    Course:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required:
            [description_html, body_translated, outcomes, audience, prerequisites,
             required_software, access_duration_days, sequential, support_policy,
             refund_policy, last_reviewed_at]
          properties:
            description_html: { type: string }
            body_translated:
              type: boolean
              description: >-
                False when locale=en was asked for. The title and subtitle have an
                English form; the description and the outcomes do not.
            outcomes: { type: array, items: { type: string } }
            audience: { type: array, items: { type: string } }
            prerequisites: { type: array, items: { type: string } }
            prerequisite_courses:
              type: array
              items: { $ref: '#/components/schemas/CoursePrerequisite' }
            required_software: { type: array, items: { type: string } }
            access_duration_days: { type: [integer, 'null'] }
            sequential: { type: boolean }
            support_policy: { type: [string, 'null'] }
            refund_policy: { type: [string, 'null'] }
            last_reviewed_at: { type: [string, 'null'], format: date-time }
            sections:
              type: array
              items: { $ref: '#/components/schemas/CourseSection' }
            instructors:
              type: array
              items:
                type: object
                required: [name, slug, credentials, role]
                properties:
                  name: { type: [string, 'null'] }
                  slug: { type: [string, 'null'] }
                  credentials: { type: [string, 'null'] }
                  role: { type: string }
            rating:
              description: Omitted entirely when there are no published reviews.
              oneOf:
                - type: 'null'
                - type: object
                  required: [average, count]
                  properties:
                    average: { type: number }
                    count: { type: integer }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/CourseReview' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/ProductVariant' }
            seo: { $ref: '#/components/schemas/Seo' }

    Lesson:
      type: object
      required: [slug, title, type, body_html, duration_seconds, is_free_preview, position, course]
      properties:
        slug: { type: string }
        title: { type: string }
        type:
          type: string
          description: 'video: the player and the text; the video file itself is not among the assets. text: the text and every file, no player. download: the files only, no text.'
        body_html:
          type: [string, 'null']
          description: 'Null for a downloads-only lesson, which shows no text.'
        duration_seconds: { type: [integer, 'null'] }
        is_free_preview: { type: boolean }
        position: { type: integer }
        course:
          type: object
          required: [slug, title]
          properties:
            slug: { type: [string, 'null'] }
            title: { type: [string, 'null'] }
        assets:
          type: array
          items:
            type: object
            required: [id, title, size_bytes, checksum_sha256]
            properties:
              download_url: { type: string }
              id: { type: integer }
              title: { type: string }
              size_bytes: { type: [integer, 'null'] }
              checksum_sha256: { type: [string, 'null'] }
              kind:
                description: A stored file, or a link (Google Drive, Dropbox…) that download_url redirects to.
                type: string
                enum: [file, link]
              provider:
                description: For a link, the service it is on; null for a stored file.
                type: [string, 'null']
                enum: [google_drive, dropbox, onedrive, other, null]
        playback:
          description: Short-lived playback descriptor; never a private source URL.
          oneOf:
            - type: 'null'
            - type: object
              required: [provider, url, token, expires_in, available, message]
              properties:
                kind: { type: string, enum: [iframe, video, link] }
                provider: { type: string }
                url: { type: [string, 'null'] }
                token: { type: [string, 'null'] }
                expires_in: { type: integer }
                available: { type: boolean }
                message: { type: [string, 'null'] }
        quiz_id: { type: [integer, 'null'] }
        assignment_id: { type: [integer, 'null'] }

    CartLine:
      type: object
      required: [variant_id, sku, product_name, product_slug, product_type, variant_name, quantity, unit_price_minor, line_total_minor, unavailable_reason]
      properties:
        variant_id: { type: integer }
        sku: { type: string }
        product_name: { type: [string, 'null'] }
        product_slug: { type: [string, 'null'] }
        product_type: { type: [string, 'null'] }
        variant_name: { type: string }
        quantity: { type: integer }
        unit_price_minor: { type: [integer, 'null'] }
        line_total_minor: { type: integer }
        unavailable_reason: { type: [string, 'null'] }

    Cart:
      type: object
      required: [token, status, currency, subtotal_minor, discount_minor, tax_minor, total_minor, coupon_code, coupon_error, is_purchasable, blockers, lines]
      properties:
        token: { type: string }
        status: { type: string }
        currency: { type: string }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        tax_minor: { type: integer }
        total_minor: { type: integer }
        coupon_code: { type: [string, 'null'] }
        coupon_error: { type: [string, 'null'] }
        is_purchasable: { type: boolean }
        blockers: { type: array, items: { type: string } }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }

    OrderItem:
      type: object
      required: [product_name, variant_name, sku, product_type, quantity, unit_price_minor, line_total_minor]
      properties:
        product_name: { type: string }
        variant_name: { type: string }
        sku: { type: string }
        product_type: { type: string }
        quantity: { type: integer }
        unit_price_minor: { type: integer }
        line_total_minor: { type: integer }

    Order:
      type: object
      required: [number, status, currency, subtotal_minor, discount_minor, tax_minor, total_minor, refunded_minor, billing_name, billing_email, placed_at, paid_at, fulfilled_at, accepted_terms]
      properties:
        number: { type: string }
        status:
          type: string
          enum:
            - draft
            - pending_payment
            - paid
            - fulfilled
            - failed
            - cancelled
            - refund_pending
            - partially_refunded
            - refunded
        currency: { type: string }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        tax_minor: { type: integer }
        total_minor: { type: integer }
        refunded_minor: { type: integer }
        billing_name: { type: [string, 'null'] }
        billing_email: { type: [string, 'null'] }
        placed_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        fulfilled_at: { type: [string, 'null'], format: date-time }
        accepted_terms: { type: array, items: { type: string } }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        invoice_number: { type: [string, 'null'] }
        timeline:
          type: array
          items:
            type: object
            required: [from, to, reason, at]
            properties:
              from: { type: [string, 'null'] }
              to: { type: string }
              reason: { type: [string, 'null'] }
              at: { type: [string, 'null'], format: date-time }

    User:
      type: object
      required: [id, name, email, phone, locale, timezone, status, email_verified, mfa_enabled, roles]
      properties:
        account_mode: { type: string, enum: [student, ecommerce] }
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        locale: { type: string }
        timezone: { type: string }
        status: { type: string }
        email_verified: { type: boolean }
        created_at:
          type: [string, 'null']
          format: date-time
          description: 'When the account was created'
        mfa_enabled: { type: boolean }
        mfa_session_verified:
          type: boolean
          description: 'Whether this session has typed a code. Staff are asked for one before the dashboard opens when it has not.'
        mfa_recovery_codes_remaining:
          type: integer
          description: 'Unused recovery codes. Only on the signed-in account itself, and only when two-step verification is on.'
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        verified_badge:
          type: boolean
          description: 'The blue badge beside the name: a verified email, every profile field filled and a photo. Present when the profile is included.'
        badge_missing:
          type: array
          description: 'What is still needed for the badge, in the order the profile form shows it. Present when the profile is included.'
          items:
            type: string
            enum: [email_verified, photo, name, phone, display_name, headline, organization, designation, district, bio]
        profile:
          type: object
          required: [display_name, headline, bio, organization, designation, district, links]
          properties:
            display_name: { type: [string, 'null'] }
            headline: { type: [string, 'null'] }
            bio: { type: [string, 'null'] }
            organization: { type: [string, 'null'] }
            designation: { type: [string, 'null'] }
            district: { type: [string, 'null'] }
            links: { type: array, items: { type: string } }

    Enrollment:
      type: object
      required: [id, status, progress_percent, starts_at, expires_at, completed_at, course]
      properties:
        id: { type: integer }
        status: { type: string, enum: [active, completed, expired, revoked] }
        progress_percent: { type: integer }
        starts_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        course: { $ref: '#/components/schemas/CourseSummary' }
        last_lesson_slug: { type: [string, 'null'] }
        certificate_id: { type: [string, 'null'] }

    DownloadEntitlement:
      type: object
      required: [id, asset, download_count, max_downloads, expires_at, revoked_at, is_usable]
      properties:
        id: { type: integer }
        asset:
          oneOf:
            - type: 'null'
            - type: object
              required: [slug, name, version, size_bytes, checksum_sha256, code_signing_status, released_at, is_available]
              properties:
                slug: { type: string }
                name: { type: string }
                version: { type: [string, 'null'] }
                size_bytes: { type: [integer, 'null'] }
                checksum_sha256: { type: [string, 'null'] }
                code_signing_status: { type: string }
                released_at: { type: [string, 'null'], format: date-time }
                is_available: { type: boolean }
        order_number: { type: [string, 'null'] }
        download_count: { type: integer }
        max_downloads: { type: [integer, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        is_usable: { type: boolean }

    ActivationRequest:
      type: object
      required: [reference, status, request_type, machine_id_masked, autocad_version, windows_version, customer_note, vendor_response, created_at, completed_at]
      properties:
        reference: { type: string }
        status:
          type: string
          enum: [submitted, under_review, needs_info, approved, completed, deactivated, rejected]
        request_type: { type: string, enum: [activation, refill, recovery] }
        machine_id_masked:
          type: string
          description: Always masked. The full identifier never leaves the server.
        autocad_version: { type: [string, 'null'] }
        windows_version: { type: [string, 'null'] }
        customer_note: { type: [string, 'null'] }
        vendor_response: { type: [string, 'null'] }
        order_number: { type: [string, 'null'] }
        license_code: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        timeline:
          type: array
          items:
            type: object
            required: [from, to, note, at]
            properties:
              from: { type: [string, 'null'] }
              to: { type: string }
              note: { type: [string, 'null'] }
              at: { type: [string, 'null'], format: date-time }

    SoftwareLicense:
      type: object
      required: [product_name, status, device_limit, issued_at, expires_at]
      properties:
        license_code: { type: string }
        product_name: { type: string }
        status: { type: string, enum: [issued, active, suspended, revoked, expired] }
        device_limit: { type: integer }
        issued_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        order_number: { type: [string, 'null'] }
        machines:
          type: array
          items:
            type: object
            required: [machine_id_masked, label, bound_at, released_at]
            properties:
              machine_id_masked: { type: string }
              label: { type: [string, 'null'] }
              bound_at: { type: [string, 'null'], format: date-time }
              released_at: { type: [string, 'null'], format: date-time }

    Certificate:
      type: object
      required: [verification_id, recipient_name, course_title, score_percent, issued_at, is_valid]
      properties:
        verification_id: { type: string }
        recipient_name: { type: string }
        course_title: { type: string }
        course_slug: { type: [string, 'null'] }
        score_percent: { type: [integer, 'null'] }
        issued_at: { type: [string, 'null'], format: date-time }
        is_valid: { type: boolean }

    SupportTicket:
      type: object
      required: [reference, subject, category, status, priority, created_at, resolved_at]
      properties:
        reference: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, pending, resolved, closed] }
        priority: { type: string }
        order_number: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        messages:
          type: array
          items:
            type: object
            required: [id, author_kind, body, is_internal, at]
            properties:
              id: { type: integer }
              author_kind: { type: string, enum: [customer, staff] }
              body: { type: string }
              is_internal: { type: boolean }
              at: { type: [string, 'null'], format: date-time }

    DownloadAsset:
      type: object
      required: [slug, name, version, size_bytes, checksum_sha256, code_signing_status, test_status, release_notes_html, released_at, is_available]
      properties:
        slug: { type: string }
        name: { type: string }
        version: { type: [string, 'null'] }
        size_bytes: { type: [integer, 'null'] }
        checksum_sha256: { type: [string, 'null'] }
        code_signing_status: { type: string }
        test_status: { type: string }
        release_notes_html: { type: string }
        released_at: { type: [string, 'null'], format: date-time }
        is_available: { type: boolean }

    ListFilters:
      type: object
      description: |
        What the filter bar above an admin list needs: how many rows each
        status holds under the current search, and which months have rows.
        Counted without the status filter itself, so the number beside
        "Draft" says how many drafts this search would show.
      required: [counts, months]
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }
        months:
          type: array
          items: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        types: { type: array, items: { type: string } }
        levels: { type: array, items: { type: string } }
        tracks:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }

    SiteSettings:
      type: object
      required: [name, url, locale, timezone, currency, support_email, support_hours, phone, business_address, legal_entity, legal_reviewed, product, analytics, overrides]
      properties:
        name: { type: string }
        url: { type: string }
        locale: { type: string }
        timezone: { type: string }
        currency: { type: string }
        support_email: { type: [string, 'null'] }
        support_hours: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        business_address: { type: [string, 'null'] }
        legal_entity: { type: [string, 'null'] }
        legal_reviewed: { type: boolean }
        product:
          type: object
          required: [designed_for, tested_autocad_versions, installer_sha256, code_signing_status]
          properties:
            designed_for: { type: string }
            tested_autocad_versions: { type: [string, 'null'] }
            installer_sha256: { type: [string, 'null'] }
            code_signing_status: { type: string }
        analytics:
          type: object
          required: [ga4_id, search_console_verification]
          properties:
            ga4_id: { type: [string, 'null'] }
            search_console_verification: { type: [string, 'null'] }
        overrides:
          type: object
          additionalProperties: true

    SitemapFeed:
      type: object
      required: [posts, pages, products, courses, attachments]
      properties:
        posts: { type: array, items: { $ref: '#/components/schemas/SitemapEntry' } }
        pages: { type: array, items: { $ref: '#/components/schemas/SitemapEntry' } }
        products: { type: array, items: { $ref: '#/components/schemas/SitemapEntry' } }
        courses: { type: array, items: { $ref: '#/components/schemas/SitemapEntry' } }
        attachments:
          type: array
          description: Attachment pages not excluded from the sitemap; the slug is the file id.
          items: { $ref: '#/components/schemas/SitemapEntry' }

    SitemapEntry:
      type: object
      required: [slug, updated_at]
      properties:
        slug: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }

    Redirect:
      type: object
      required: [source_path, destination_path, status_code]
      properties:
        source_path: { type: string }
        destination_path: { type: string }
        status_code: { type: integer, enum: [301, 302, 307, 308] }

    SearchHit:
      type: object
      required: [slug, title, excerpt]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }

    SeoWriteRequest:
      type: object
      required: [meta_title, meta_description, canonical_url, og_media_id, noindex, nofollow]
      properties:
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        focus_keyword: { type: [string, 'null'] }
        canonical_url: { type: [string, 'null'] }
        og_media_id: { type: [integer, 'null'] }
        noindex: { type: boolean }
        nofollow: { type: boolean }

    PostWriteRequest:
      type: object
      description: |
        Article body is Markdown source. Raw HTML is stripped at render time
        rather than stored as trusted markup, so the frontend never sanitises.
      required: [slug, title, excerpt, body_markdown, author_id, reviewed_by_author_id, reviewed_at, cover_media_id, funnel_stage, search_intent, scheduled_for, category_ids, tag_ids]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        title: { type: string, maxLength: 255 }
        excerpt: { type: [string, 'null'], maxLength: 512 }
        body_markdown: { type: string, maxLength: 200000 }
        author_id: { type: [integer, 'null'] }
        reviewed_by_author_id: { type: [integer, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        cover_media_id: { type: [integer, 'null'] }
        funnel_stage:
          type: [string, 'null']
          enum: [awareness, consideration, decision, null]
        search_intent:
          type: [string, 'null']
          enum: [informational, commercial, transactional, navigational, null]
        scheduled_for: { type: [string, 'null'], format: date-time }
        category_ids: { type: array, items: { type: integer }, maxItems: 5 }
        tag_ids: { type: array, items: { type: integer }, maxItems: 12 }
        seo: { $ref: '#/components/schemas/SeoWriteRequest' }

    PageWriteRequest:
      type: object
      required: [slug, title, body_markdown, template, requires_legal_review]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        title: { type: string, maxLength: 255 }
        body_markdown: { type: string, maxLength: 200000 }
        template: { type: string, enum: [default, legal, support] }
        requires_legal_review: { type: boolean }
        seo: { $ref: '#/components/schemas/SeoWriteRequest' }

    MediaItem:
      type: object
      required:
        - id
        - url
        - original_name
        - title
        - mime_type
        - size_bytes
        - width
        - height
        - duration_seconds
        - alt_text
        - caption
        - description
        - credit
        - focal
        - exclude_from_sitemap
        - editable
        - edited
        - attachment_path
        - uploaded_by
        - uploaded_at
      properties:
        id: { type: integer }
        url: { type: [string, 'null'], description: 'Carries ?v= after an in-place edit, so caches refetch.' }
        original_name: { type: string }
        title: { type: [string, 'null'] }
        mime_type: { type: string }
        size_bytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_seconds: { type: [integer, 'null'], description: A video's length. }
        alt_text: { type: [string, 'null'] }
        caption: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        credit: { type: [string, 'null'] }
        focal:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        exclude_from_sitemap: { type: boolean }
        editable: { type: boolean, description: 'A JPEG, PNG or WebP on the public disk.' }
        edited: { type: boolean, description: The original is kept and can be restored. }
        attachment_path: { type: [string, 'null'], description: 'The public attachment page, /attachment/{id}.' }
        uploaded_by:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        uploaded_at: { type: [string, 'null'], format: date-time }

    MediaDetail:
      allOf:
        - $ref: '#/components/schemas/MediaItem'
        - type: object
          required: [used_in, shared_as_social_image, focus_keywords]
          properties:
            used_in:
              type: array
              description: Content using the file as a cover or inside its text.
              items:
                type: object
                required: [label, title, edit_path]
                properties:
                  label: { type: string }
                  title: { type: string }
                  edit_path: { type: [string, 'null'] }
            shared_as_social_image: { type: integer }
            focus_keywords:
              type: array
              description: Focus keywords of that content, offered as the alt text.
              items:
                type: object
                required: [keyword, source]
                properties:
                  keyword: { type: string }
                  source: { type: string }

    Attachment:
      type: object
      required: [id, url, title, original_name, mime_type, size_bytes, width, height, duration_seconds, alt_text, caption, description, exclude_from_sitemap, uploaded_at, updated_at]
      properties:
        id: { type: integer }
        url: { type: [string, 'null'] }
        title: { type: string }
        original_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_seconds: { type: [integer, 'null'] }
        alt_text: { type: [string, 'null'] }
        caption: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        exclude_from_sitemap: { type: boolean }
        uploaded_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    Setting:
      type: object
      required: [id, key, group, value, is_public]
      properties:
        id: { type: integer }
        key: { type: string }
        group: { type: string }
        value: true
        is_public: { type: boolean }

    AuditLogEntry:
      type: object
      required: [id, action, subject_type, subject_id, context, ip_address, at]
      properties:
        id: { type: integer }
        action: { type: string }
        actor:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, email]
              properties:
                id: { type: integer }
                name: { type: string }
                email: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [integer, 'null'] }
        context:
          type: [object, 'null']
          additionalProperties: true
        ip_address: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        at: { type: [string, 'null'], format: date-time }

    CourseAnnouncement:
      type: object
      required: [id, title, body_html, published_at]
      properties:
        id: { type: integer }
        title: { type: string }
        body_html: { type: string }
        author_name: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }

    CourseQuestionReply:
      type: object
      required: [id, body, from_instructor, created_at]
      properties:
        id: { type: integer }
        body: { type: string }
        from_instructor: { type: boolean }
        author_name: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    CourseQuestion:
      type: object
      required: [id, title, body, status, is_pinned, is_mine, reply_count, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [draft, in_review, scheduled, published, archived] }
        is_pinned: { type: boolean }
        is_mine: { type: boolean }
        reply_count: { type: integer }
        course:
          type: [object, 'null']
          description: In the dashboard's list.
          properties:
            slug: { type: string }
            title: { type: string }
        lesson:
          type: [object, 'null']
          properties:
            slug: { type: string }
            title: { type: string }
        author_name: { type: [string, 'null'] }
        answered_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        replies:
          type: array
          items: { $ref: '#/components/schemas/CourseQuestionReply' }

    LessonNote:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: integer }
        body: { type: string }
        position_seconds: { type: [integer, 'null'] }
        lesson:
          type: object
          properties:
            slug: { type: [string, 'null'] }
            title: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    CoursePrerequisite:
      type: object
      required: [slug, title, is_blocking]
      properties:
        slug: { type: string }
        title: { type: string }
        is_blocking: { type: boolean }

    Gradebook:
      type: object
      required: [lessons, quizzes, assignments, average_percent, pass_percentage]
      properties:
        lessons:
          type: object
          required: [total, completed]
          properties:
            total: { type: integer }
            completed: { type: integer }
        quizzes:
          type: array
          items:
            type: object
            required: [id, title, score_percent, passed, attempts_used, attempts_allowed, pass_percentage]
            properties:
              id: { type: integer }
              title: { type: string }
              score_percent: { type: [integer, 'null'] }
              passed: { type: boolean }
              attempts_used: { type: integer }
              attempts_allowed: { type: integer }
              pass_percentage: { type: integer }
        assignments:
          type: array
          items:
            type: object
            required: [id, title, status, score_percent, pass_percentage]
            properties:
              id: { type: integer }
              title: { type: string }
              status: { type: string }
              score_percent: { type: [integer, 'null'] }
              feedback: { type: [string, 'null'] }
              pass_percentage: { type: integer }
              submitted_at: { type: [string, 'null'], format: date-time }
              reviewed_at: { type: [string, 'null'], format: date-time }
        average_percent:
          type: [integer, 'null']
          description: Null until at least one quiz or assignment has been graded.
        pass_percentage: { type: integer }
        completed_at: { type: [string, 'null'], format: date-time }
    NotificationItem:
      type: object
      description: One notification, worded in the language asked for.
      required: [id, type, category, title, body, detail, url, read, created_at, conversation, person]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: 'Event key, for example order.paid or ticket.staff_replied' }
        category: { type: string, enum: [orders, licences, support, learning, content, users, security] }
        title: { type: string }
        body: { type: string, description: 'One-line summary' }
        detail: { type: [string, 'null'], description: 'What the other person wrote, shortened' }
        url: { type: [string, 'null'], description: 'Site-relative page the notification opens, if any' }
        read: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        conversation:
          description: The conversation it belongs to, which the bell can open in the chat window.
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, key]
              properties:
                kind: { type: string, enum: [ticket, contact, question, comment] }
                key: { type: string }
        person:
          type: object
          description: Who it is about. The photo address is only given to staff who may see user profiles.
          required: [name, avatar_url]
          properties:
            name: { type: [string, 'null'] }
            avatar_url: { type: [string, 'null'] }
    PendingCount:
      type: object
      required: [key, count, url]
      properties:
        key: { type: string, enum: [payments, tickets, contacts, questions, comments, activations] }
        count: { type: integer }
        url: { type: string }
    ConversationPerson:
      type: object
      required: [name, email, avatar_url]
      properties:
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
    ConversationSummary:
      type: object
      required: [kind, key, title, subtitle, status, waiting, preview, preview_from, at, person, url]
      properties:
        kind: { type: string, enum: [ticket, contact, question, comment] }
        key: { type: string, description: 'Ticket reference, or the id of the contact message, question or comment' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        status: { type: string }
        waiting: { type: boolean, description: 'Waiting for the team to reply or decide' }
        preview: { type: [string, 'null'] }
        preview_from: { type: string, enum: [customer, staff] }
        at: { type: [string, 'null'], format: date-time }
        person: { $ref: '#/components/schemas/ConversationPerson' }
        url: { type: string }
    ConversationMessage:
      type: object
      required: [id, from, author, body, at, avatar_url]
      properties:
        id: { type: string }
        from: { type: string, enum: [customer, staff, note], description: 'note = internal ticket note, never shown to the customer' }
        author: { type: [string, 'null'] }
        body: { type: string }
        at: { type: [string, 'null'], format: date-time }
        avatar_url: { type: [string, 'null'] }
    ConversationThread:
      type: object
      required: [kind, key, title, subtitle, status, waiting, at, person, url, can_reply, actions, messages]
      properties:
        kind: { type: string, enum: [ticket, contact, question, comment] }
        key: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        status: { type: string }
        waiting: { type: boolean }
        at: { type: [string, 'null'], format: date-time }
        person: { $ref: '#/components/schemas/ConversationPerson' }
        url: { type: string }
        can_reply: { type: boolean }
        actions:
          type: object
          required: [internal_note, resolve, moderate]
          properties:
            internal_note: { type: boolean }
            resolve: { type: boolean }
            moderate: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
    NotificationUnread:
      type: object
      required: [meta]
      properties:
        meta:
          type: object
          required: [unread]
          properties:
            unread: { type: integer }
    NotificationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationItem' }
        meta:
          type: object
          required: [current_page, last_page, per_page, total, unread]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            unread: { type: integer }
    NotificationFeed:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationItem' }
        meta:
          type: object
          required: [unread]
          properties:
            unread: { type: integer }
            pending:
              type: array
              description: Staff only - what is still waiting on this person
              items: { $ref: '#/components/schemas/PendingCount' }
            messages_waiting: { type: integer, description: 'Staff only - conversations waiting for a reply' }
    NotificationPreference:
      type: object
      required: [category, email, default]
      properties:
        category: { type: string, enum: [orders, licences, support, learning, content, users, security] }
        email: { type: boolean, description: 'Whether this category also arrives by email' }
        default: { type: boolean, description: 'What applies when the person has not chosen' }
    NotificationEmailEntry:
      type: object
      required: [id, source, type, label, recipient, subject, status, attempts, failure_reason, can_retry, created_at, sent_at, last_attempt_at]
      properties:
        id: { type: integer }
        source: { type: string, enum: [notification, mail], description: 'notification emails are sent from the log; mail rows record the site''s other emails' }
        type: { type: string }
        label: { type: string }
        recipient: { type: string }
        subject: { type: [string, 'null'] }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        failure_reason: { type: [string, 'null'] }
        can_retry: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        last_attempt_at: { type: [string, 'null'], format: date-time }
    FailedMailJob:
      type: object
      required: [uuid, job, reason, failed_at]
      properties:
        uuid: { type: string, format: uuid }
        job: { type: string, description: 'The mail or mail job that failed' }
        reason: { type: string }
        failed_at: { type: [string, 'null'], format: date-time }

paths:
  /uploads/library:
    get:
      tags: [Account]
      operationId: listUploadLibrary
      summary: List previously uploaded files allowed for this upload destination
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [public, personal, course] } }
        - { name: course_id, in: query, description: Required for course scope, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated authorized files; storage paths are never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer }
                  last_page: { type: integer }
                  total: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        source: { type: string, enum: [media, lesson, video, photo, assignment, proof] }
                        name: { type: string }
                        mime_type: { type: [string, 'null'] }
                        size_bytes: { type: [integer, 'null'] }
                        url: { type: [string, 'null'], description: 'A public library file''s address; null for private files.' }
                        uploaded_at: { type: [string, 'null'] }
        '401': { description: Sign-in required }
        '403': { description: This library is not accessible to this user }
  /uploads/library/{source}/{id}:
    get:
      tags: [Account]
      operationId: downloadUploadLibraryFile
      summary: Download an authorized existing upload for reuse in an upload field
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [public, personal, course] } }
        - { name: course_id, in: query, description: Required for course scope, schema: { type: integer } }
      responses:
        '200':
          description: Private no-store file download; authorization is checked again
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Sign-in required }
        '403': { description: Library access denied }
        '404': { description: File missing or not accessible in the selected library }

  /site/settings:
    get:
      tags: [Site]
      operationId: getSiteSettings
      summary: Owner-configured site values
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SiteSettings' }

  /site/sitemap:
    get:
      tags: [Site]
      operationId: getSitemapFeed
      summary: Indexable URLs for app/sitemap.ts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SitemapFeed' }

  /site/redirects:
    get:
      tags: [Site]
      operationId: listRedirects
      summary: Active 301 map consumed by the Next.js proxy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Redirect' }

  /site/redirect:
    get:
      tags: [Site]
      operationId: resolveRedirect
      summary: Resolve redirect
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A redirect, or null when the path is not mapped
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Redirect'

  /posts:
    get:
      tags: [Content]
      operationId: listPosts
      summary: List posts
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, title] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Published articles only
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/Pagination' }

  /posts/{slug}:
    get:
      tags: [Content]
      operationId: getPost
      summary: Get post
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{slug}/related:
    get:
      tags: [Content]
      operationId: listRelatedPosts
      summary: List related posts
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }

  /categories:
    get:
      tags: [Content]
      operationId: listCategories
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /categories/{slug}:
    get:
      tags: [Content]
      operationId: getCategory
      summary: Get category
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }

  /authors:
    get:
      tags: [Content]
      operationId: listAuthors
      summary: List authors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Author' }

  /authors/{slug}:
    get:
      tags: [Content]
      operationId: getAuthor
      summary: Get author
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Author' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{slug}/comments:
    get:
      tags: [Content]
      operationId: listPostComments
      summary: List approved comments on an article
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostComment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Content]
      operationId: createPostComment
      summary: Comment on an article
      description: >-
        Needs a session. What is written is held as `pending` and appears
        nowhere - not on the page, not in the count, not in the structured data
        - until a moderator approves it. One comment per reader per article.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 3, maxLength: 2000 }
                rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
                website:
                  type: [string, 'null']
                  description: Honeypot. Hidden from people; a filled one is dropped.
      responses:
        '201':
          description: Held for moderation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PostComment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /pages/{slug}:
    get:
      tags: [Content]
      operationId: getPage
      summary: Get page
      description: >-
        With locale=en the `<slug>-en` document is returned when one exists,
        otherwise the Bengali document with translated=false.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Page' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: type
          in: query
          schema:
            type: string
            enum: [software_license, credit_refill, course, bundle, digital_resource]
        - name: exclude_type
          in: query
          description: Leave out one product type. The products page leaves out courses, which have their own menu.
          schema:
            type: string
            enum: [software_license, credit_refill, course, bundle, digital_resource]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSummary' }
                  meta: { $ref: '#/components/schemas/Pagination' }

  /products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get product
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - name: locale
          in: query
          required: false
          description: Language of the product prose. Defaults to Bengali.
          schema: { type: string, enum: [bn, en] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List courses
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: level
          in: query
          schema: { type: string, enum: [beginner, intermediate, advanced] }
        - name: track
          in: query
          description: Catalogue subject track slug.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Published courses that have at least one lesson
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CourseSummary' }
                  meta: { $ref: '#/components/schemas/Pagination' }

  /courses/{slug}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get course
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Course' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{courseSlug}/preview/{lessonSlug}:
    get:
      tags: [Courses]
      operationId: getPreviewLesson
      summary: Get preview lesson
      description: Only lessons flagged as a free preview are reachable here.
      parameters:
        - { name: courseSlug, in: path, required: true, schema: { type: string } }
        - { name: lessonSlug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }

  /releases:
    get:
      tags: [Catalog]
      operationId: listReleases
      summary: List releases
      responses:
        '200':
          description: Public release metadata; never the file itself
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DownloadAsset' }

  /releases/{slug}:
    get:
      tags: [Catalog]
      operationId: getRelease
      summary: Get release
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DownloadAsset' }
        '404': { $ref: '#/components/responses/NotFound' }

  /verify/{verificationId}:
    get:
      tags: [Courses]
      operationId: verifyCertificate
      summary: Verify certificate
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid, verification_id, recipient_name, course_title, issued_at]
                    properties:
                      valid: { type: boolean }
                      reason: { type: [string, 'null'] }
                      verification_id: { type: string }
                      recipient_name: { type: string }
                      course_title: { type: string }
                      course_slug: { type: [string, 'null'] }
                      issued_at: { type: [string, 'null'], format: date-time }
        '404':
          description: No certificate with that id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid]
                    properties:
                      valid: { type: boolean }
                      reason: { type: string }

  /search:
    get:
      tags: [Site]
      operationId: search
      summary: Search
      description: >-
        Matches both languages whatever locale says; only the result text
        follows it. An English reader searching a Bengali term still finds the
        article, which matters on a site whose articles are written in Bengali.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published content only. Results pages are noindex.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [query, posts, courses, products]
                    properties:
                      query: { type: string }
                      posts: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
                      courses: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
                      products: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }

  /media/{medium}:
    get:
      tags: [Content]
      operationId: getAttachment
      summary: An attachment page's file, title, caption and description
      description: Only files on the public disk have a page.
      parameters:
        - { name: medium, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /affiliate-visits:
    post:
      tags: [Site]
      operationId: recordAffiliateVisit
      summary: Record a visit through a referral link
      description: |
        Counts a visitor who arrived with `?ref=code` - once per visitor a day -
        and says whether the code is live and how many days to remember it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
                path: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid, code, cookie_days]
                    properties:
                      valid: { type: boolean }
                      code: { type: [string, 'null'] }
                      cookie_days: { type: integer }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contact:
    post:
      tags: [Site]
      operationId: submitContactMessage
      summary: Submit contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email }
                subject: { type: string, minLength: 3, maxLength: 255 }
                message: { type: string, minLength: 10, maxLength: 5000 }
                website:
                  type: string
                  description: Honeypot. Must be absent; any value is rejected.
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, accepts_terms]
              properties:
                account_mode: { type: string, enum: [student, ecommerce] }
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: [string, 'null'] }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
                accepts_terms: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Registered and signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                remember: { type: boolean }
      responses:
        '200':
          description: |
            Signed in, and the session cookie is set on the response - unless
            the account has two-step verification on, in which case nothing is
            signed in yet and `data.mfa_required` is true. Send the code to
            `/auth/mfa` within five minutes to finish.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/User' }
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [mfa_required]
                        properties:
                          mfa_required: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/mfa:
    post:
      tags: [Auth]
      operationId: completeTwoFactorSignIn
      summary: Finish signing in with a two-step code
      description: |
        The second half of a sign-in that answered `mfa_required` (password or
        Google). The session holds who is halfway through for five minutes.
        Each code works once. Three wrong codes lock the account's challenge
        for fifteen minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Either the six digits from the authenticator app, or one recovery code.'
              properties:
                code: { type: string, maxLength: 10, description: 'The six digits the authenticator app shows' }
                recovery_code: { type: string, maxLength: 40, description: 'One of the recovery codes, used up by this request' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/mfa:
    post:
      tags: [Account]
      operationId: startTwoFactorSetup
      summary: Start setting up two-step verification
      security: [{ sessionCookie: [] }]
      description: |
        Returns the secret once, for the authenticator app to store. It counts
        for nothing until a code from the app confirms it. Staff must complete
        this before the admin API will answer them.
      responses:
        '200':
          description: Secret issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, otpauth_uri, issuer, account]
                    properties:
                      secret: { type: string, description: 'Base32, to type into an authenticator app' }
                      otpauth_uri: { type: string, description: 'The same secret as an otpauth:// URI for a QR code' }
                      issuer: { type: string, description: 'The name the app shows above the account' }
                      account: { type: string, description: 'The account name the app shows (the email address)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Account]
      operationId: disableTwoFactor
      summary: Turn two-step verification off
      description: 'Needs the password, from a session that has typed a code (403 otherwise).'
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "The account's current password" }
      responses:
        '200':
          description: Turned off
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mfa_enabled]
                    properties:
                      mfa_enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/mfa/confirm:
    post:
      tags: [Account]
      operationId: confirmTwoFactorSetup
      summary: Confirm the authenticator app is working
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 10 }
      responses:
        '200':
          description: Two-step verification is on
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mfa_enabled, recovery_codes]
                    properties:
                      mfa_enabled: { type: boolean }
                      recovery_codes:
                        type: array
                        items: { type: string }
                        description: 'Shown this once; only their hashes are kept'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/mfa/verify:
    post:
      tags: [Account]
      operationId: verifyTwoFactorSession
      summary: Enter a code for a session that signed in without one
      description: 'Staff signed in through Google or a remember-me cookie are asked for a code before the dashboard opens. Three wrong codes lock it for fifteen minutes.'
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Either the six digits from the authenticator app, or one recovery code.'
              properties:
                code: { type: string, maxLength: 10, description: 'The six digits the authenticator app shows' }
                recovery_code: { type: string, maxLength: 40, description: 'One of the recovery codes, used up by this request' }
      responses:
        '200':
          description: This session has now typed a code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mfa_session_verified]
                    properties:
                      mfa_session_verified: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/mfa/recovery-codes:
    post:
      tags: [Account]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      description: 'Needs the password, from a session that has typed a code (403 otherwise). The old codes stop working.'
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "The account's current password" }
      responses:
        '200':
          description: A new set, shown this once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Forgot password
      description: Always answers the same way, so it cannot enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Resend verification email
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Who is signed in, if anyone
      description: |
        Always 200. `data` is the signed-in user, or null for a visitor who is
        not signed in or whose account is inactive. The site header uses this,
        so a signed-out visitor's page view logs no failed request; `/me` keeps
        answering 401.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/User'
                      - type: 'null'
        '429':
          description: Too many requests from this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Get current user
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Account]
      operationId: updateProfile
      summary: Update profile
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: [string, 'null'] }
                locale: { type: string, enum: [bn, en] }
                timezone: { type: string }
                account_mode: { type: string, enum: [student, ecommerce] }
                profile:
                  type: object
                  properties:
                    display_name: { type: [string, 'null'] }
                    headline: { type: [string, 'null'] }
                    bio: { type: [string, 'null'] }
                    organization: { type: [string, 'null'] }
                    designation: { type: [string, 'null'] }
                    district: { type: [string, 'null'] }
                    links: { type: array, items: { type: string, format: uri } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get cart
      description: |
        Anonymous visitors are addressed by an opaque HttpOnly `cart_token`
        cookie. Totals are always recomputed on the server.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }

  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add cart item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id]
              properties:
                variant_id: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
        '422':
          description: The item has no published price, or is inactive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /cart/items/{variant}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Update cart item
      parameters:
        - { name: variant, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 99 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove cart item
      parameters:
        - { name: variant, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }

  /cart/coupon:
    post:
      tags: [Cart]
      operationId: applyCoupon
      summary: Apply coupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 48 }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Cart]
      operationId: removeCoupon
      summary: Remove coupon
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Cart' }

  /checkout:
    post:
      tags: [Checkout]
      operationId: checkout
      summary: Checkout
      security: [{ sessionCookie: [] }]
      description: |
        Creates a pending order from the server-priced cart and opens a gateway
        session. Any total sent by the browser is ignored.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, accepts_terms, accepts_privacy, accepts_refund_policy]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email }
                phone: { type: [string, 'null'] }
                accepts_terms: { type: boolean, enum: [true] }
                accepts_privacy: { type: boolean, enum: [true] }
                accepts_refund_policy: { type: boolean, enum: [true] }
                accepts_eula: { type: boolean }
                ref:
                  type: [string, 'null']
                  maxLength: 64
                  description: Affiliate code remembered from a referral link. Unknown codes are ignored.
      responses:
        '201':
          description: Order created; send the customer to redirect_url
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [order, payment_reference, redirect_url]
                    properties:
                      order: { $ref: '#/components/schemas/Order' }
                      payment_reference: { type: [string, 'null'] }
                      redirect_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503':
          description: The payment gateway is not configured or not reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /payments/{reference}/status:
    get:
      tags: [Payments]
      operationId: getPaymentStatus
      summary: Get payment status
      security: [{ sessionCookie: [] }]
      description: |
        Read-only. Landing on the success URL grants nothing; the customer sees
        a confirming state until a validated gateway callback settles the order.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reference, payment_status, order_number, order_status, is_settled, needs_review]
                    properties:
                      reference: { type: string }
                      payment_status: { type: string }
                      order_number: { type: string }
                      order_status: { type: string }
                      is_settled: { type: boolean }
                      needs_review: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/sslcommerz/ipn:
    post:
      tags: [Payments]
      operationId: sslcommerzIpn
      summary: SSLCOMMERZ IPN
      description: |
        Server-to-server callback from SSLCOMMERZ. Every callback is stored once
        by fingerprint and verified against the Order Validation API before an
        order can be marked paid. Always answers 200 so the gateway does not
        retry because our own validation rejected it.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tran_id: { type: string }
                val_id: { type: string }
                status: { type: string }
                amount: { type: string }
                currency: { type: string }
                bank_tran_id: { type: string }
                risk_level: { type: string }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [status, reference]
                properties:
                  status: { type: string, enum: [accepted, rejected, ignored] }
                  reference: { type: [string, 'null'] }

  /account/orders:
    get:
      tags: [Account]
      operationId: listMyOrders
      summary: List my orders
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /account/orders/{number}:
    get:
      tags: [Account]
      operationId: getMyOrder
      summary: Get my order
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /account/orders/{number}/receipt:
    get:
      tags: [Account]
      operationId: downloadMyMoneyReceipt
      summary: Download the money receipt PDF for one of my paid orders
      description: 'The same PDF the receipt email carried. 404 until the order is paid.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The receipt
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /account/orders/{number}/invoice:
    get:
      tags: [Account]
      operationId: getMyInvoice
      summary: Get the invoice snapshot for one of my orders
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [number, currency, total_minor, snapshot]
                    properties:
                      number: { type: string }
                      issued_at: { type: [string, 'null'], format: date-time }
                      currency: { type: string }
                      total_minor: { type: integer }
                      snapshot: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No invoice has been issued for this order yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /account/affiliate:
    get:
      tags: [Account]
      operationId: getMyAffiliate
      summary: My affiliate link, earnings and payouts
      description: The program's terms, and the membership - null until the customer joins.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Account]
      operationId: joinAffiliateProgram
      summary: Join the affiliate program
      description: Joining again returns the existing membership with 200.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: [string, 'null'], minLength: 3, maxLength: 32 }
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Account]
      operationId: updateMyAffiliate
      summary: Change my link code or payout details
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 3, maxLength: 32 }
                payout_method: { type: [string, 'null'], enum: [bkash, nagad, rocket, bank, other, null] }
                payout_account: { type: [string, 'null'], maxLength: 100 }
                payout_name: { type: [string, 'null'], maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /account/downloads:
    get:
      tags: [Account]
      operationId: listMyDownloads
      summary: List my downloads
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DownloadEntitlement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /account/downloads/{slug}:
    post:
      tags: [Account]
      operationId: requestDownload
      summary: Request download
      security: [{ sessionCookie: [] }]
      description: |
        Issues access to one protected file. Object storage returns a short-lived
        signed URL; a local private disk streams the file through this request.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A signed URL, or the file itself
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The release has no stored file yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /account/courses:
    get:
      tags: [Account]
      operationId: listMyEnrollments
      summary: List my enrollments
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }

  /account/certificates:
    get:
      tags: [Account]
      operationId: listMyCertificates
      summary: List my certificates
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Certificate' } }

  /account/licenses:
    get:
      tags: [Account]
      operationId: listMyLicenses
      summary: List my licenses
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SoftwareLicense' } }

  /account/activation-requests:
    get:
      tags: [Account]
      operationId: listMyActivationRequests
      summary: List my activation requests
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ActivationRequest' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Account]
      operationId: submitActivationRequest
      summary: Submit activation request
      security: [{ sessionCookie: [] }]
      description: |
        Requires a paid order the caller owns. The Machine ID is encrypted at
        rest and only ever returned masked. Recovery-file uploads are not
        accepted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
