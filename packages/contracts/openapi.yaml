        '401': { $ref: '#/components/responses/Unauthenticated' }

  /account/downloads/{slug}:
    post:
      tags: [Account]
      operationId: requestDownload
      summary: Request download
      security: [{ sessionCookie: [] }]
      description: |
        Issues access to one protected file. Object storage returns a short-lived
        signed URL; a local private disk streams the file through this request.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A signed URL, or the file itself
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The release has no stored file yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /account/courses:
    get:
      tags: [Account]
      operationId: listMyEnrollments
      summary: List my enrollments
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
