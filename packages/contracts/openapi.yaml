      parameters:
        - { name: courseSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [course, certificate, review, enrollment, sections]
                    properties:
                      course:
                        type: object
                        required: [slug, title, sequential, issues_certificate]
                        properties:
                          slug: { type: string }
                          title: { type: string }
                          sequential: { type: boolean }
                          issues_certificate: { type: boolean }
                      certificate:
                        description: This learner's valid certificate for the course, once issued.
                        type: [object, 'null']
                        required: [verification_id, issued_at]
                        properties:
                          verification_id: { type: string }
                          issued_at: { type: [string, 'null'], format: date-time }
                      review:
                        description: This learner's own review, whatever its moderation status.
                        type: [object, 'null']
                        required: [rating, title, body, status]
                        properties:
                          rating: { type: integer, minimum: 1, maximum: 5 }
                          title: { type: [string, 'null'] }
                          body: { type: [string, 'null'] }
                          status: { type: string }
                      enrollment:
                        type: object
                        required: [status, progress_percent]
                        properties:
                          status: { type: string }
                          progress_percent: { type: integer }
                          expires_at: { type: [string, 'null'], format: date-time }
                          last_lesson_id: { type: [integer, 'null'] }
                      sections:
                        type: array
                        items:
                          type: object
                          required: [id, title, lessons]
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            lessons:
                              type: array
                              items:
                                type: object
                                required: [slug, title, type, duration_seconds, has_video, assets_count, has_quiz, has_assignment, is_completed, is_unlocked]
                                properties:
                                  slug: { type: string }
                                  title: { type: string }
                                  type: { type: string }
                                  duration_seconds: { type: [integer, 'null'] }
                                  has_video: { type: boolean }
                                  assets_count: { type: integer }
                                  has_quiz: { type: boolean }
                                  has_assignment: { type: boolean }
                                  is_completed: { type: boolean }
                                  is_unlocked: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

