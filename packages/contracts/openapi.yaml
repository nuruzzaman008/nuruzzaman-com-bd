    get:
      tags: [Admin]
      operationId: listNotificationEmails
      summary: The email log - every email the site sent or tried to send
      description: Super admins and admins. Also lists queued emails whose job failed outright.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, pending, sent, failed] } }
        - { name: source, in: query, schema: { type: string, enum: [all, notification, mail] } }
        - { name: locale, in: query, schema: { type: string, enum: [bn, en] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, failed_jobs]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationEmailEntry' }
                  meta:
                    type: object
                    required: [current_page, last_page, total, summary]
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
                      summary:
                        type: object
                        required: [pending, failed, sent_last_7_days, mail_delivers, mailer]
                        properties:
                          pending: { type: integer }
                          failed: { type: integer }
                          sent_last_7_days: { type: integer }
                          mail_delivers: { type: boolean, description: False when the mailer only writes to a log }
                          mailer: { type: string }
                  failed_jobs:
                    type: array
                    items: { $ref: '#/components/schemas/FailedMailJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
