  /admin/media:
    get:
      tags: [Admin]
      operationId: adminListMedia
      summary: Admin list media
      description: |
        Newest first, 42 a page. `q` matches part of the file name, alt text or
        caption; `type` narrows to images or PDFs; `month` (YYYY-MM) to one
        upload month. `filters.months` lists every month with uploads.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [image, video, pdf] } }
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MediaItem' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
                  filters:
                    type: object
                    required: [months]
                    properties:
                      months: { type: array, items: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminUploadMedia
      summary: Admin upload media
      security: [{ sessionCookie: [] }]
      description: |
        Validated on declared MIME type, real extension and size. Stored under a
        generated name so a crafted filename cannot traverse a path.
      requestBody:
        required: true
        description: |
          The file directly, or - for anything over the host's 2 MB request
          limit, every video - the upload_id, part count and file name of parts
          already sent to /admin/uploads/chunks. Images and PDFs up to 20 MB;
          MP4 and WebM videos up to 300 MB.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                alt_text: { type: string }
                caption: { type: string }
                credit: { type: string }
                duration_seconds: { type: integer }
          application/json:
            schema:
              type: object
              required: [upload_id, total, filename]
              properties:
                upload_id: { type: string, format: uuid }
                total: { type: integer, minimum: 1 }
                filename: { type: string }
                title: { type: [string, 'null'] }
                alt_text: { type: [string, 'null'] }
                caption: { type: [string, 'null'] }
                credit: { type: [string, 'null'] }
                duration_seconds: { type: [integer, 'null'], description: "A video's length, read by the browser." }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

