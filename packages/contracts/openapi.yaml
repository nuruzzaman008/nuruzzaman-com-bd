          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ActivationRequest' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/activation-requests/{reference}:
    get:
      tags: [Admin]
      operationId: adminGetActivationRequest
      summary: Admin get activation request
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ActivationRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/activation-requests/{reference}/transition:
    post:
      tags: [Admin]
      operationId: adminTransitionActivationRequest
      summary: Admin transition activation request
      security: [{ sessionCookie: [] }]
      description: |
        Moves a request through the Phase 1 review workflow and carries back the
        safe customer response the offline vendor process produced. Never paste
        a token, key or recovery blob into `vendor_response`.

        Completing a request binds its machine to the licence and takes one of
        the licence's seats; `deactivated` releases it. The server refuses a
        completion with no seat free unless `override_device_limit` is sent.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [submitted, under_review, needs_info, approved, completed, deactivated, rejected]
                note: { type: [string, 'null'], maxLength: 512 }
                vendor_response: { type: [string, 'null'], maxLength: 4000 }
                internal_note: { type: [string, 'null'], maxLength: 4000 }
                notify: { type: boolean }
                override_device_limit:
                  type: boolean
                  description: |
                    Completes the activation even though the licence has no seat
                    free. Recorded on the request's history and in the audit log.
                    Without it, completing past the device limit is refused.
      responses:
        '200':
          description: Transitioned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ActivationRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

