openapi: 3.1.0
info:
  title: NB Offline Wallet — Phase 1 draft contract
  version: 0.1.0
  description: DESIGN ONLY; endpoints are not implemented or registered. Existing
    login, license activation and payment workflows remain unchanged. Feature
    defaults off. Credit/debit means tokens; reserves do not create credits.
  license:
    name: Proprietary
servers:
  - url: https://nuruzzaman.com.bd/api
    description: Proposed same-origin routes, using existing API proxy
tags:
  - name: Wallet
    description: Confirmed device wallet operations; admin APIs are a later phase.
security:
  - DeviceBearer: []
paths:
  /wallet/connect:
    post:
      operationId: connectOfflineWallet
      summary: Reserve an offline lease for an already-confirmed device
      tags:
        - Wallet
      responses:
        "200":
          description: Successful operation. Balances are integer tokens, not currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponse"
        "401":
          description: Missing, expired or revoked device credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Inactive user/license/wallet, unconfirmed device or ownership
            mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, insufficient funds, reused ID with changed body,
            duplicate transaction in a different batch, or invalid sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid request or policy limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Feature disabled or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      description: "DRAFT ONLY: no route registered. Use existing
        /api/v1/licensing/pair and authenticated website
        /api/v1/account/connect-device first. This endpoint never logs a user in
        or replaces activation. It reserves available funds and increments
        wallet version. Same request_id and canonical body returns the original
        response without reserving again."
  /wallet/balance:
    get:
      operationId: readOfflineWalletBalance
      summary: Read server-confirmed balances for the authenticated device license
      tags:
        - Wallet
      responses:
        "200":
          description: Successful operation. Balances are integer tokens, not currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Missing, expired or revoked device credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Inactive user/license/wallet, unconfirmed device or ownership
            mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, insufficient funds, reused ID with changed body,
            duplicate transaction in a different batch, or invalid sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid request or policy limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Feature disabled or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/sync:
    post:
      operationId: syncOfflineWallet
      summary: Atomically settle a device usage batch
      tags:
        - Wallet
      responses:
        "200":
          description: Successful operation. Balances are integer tokens, not currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          description: Missing, expired or revoked device credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Inactive user/license/wallet, unconfirmed device or ownership
            mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, insufficient funds, reused ID with changed body,
            duplicate transaction in a different batch, or invalid sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid request or policy limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Feature disabled or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      description: DRAFT ONLY. Authenticate and check revocation on every request.
        Look up prior request_id/hash BEFORE version check so a successful retry
        returns its original response. Same ID/different body returns 409.
        Verify lease ownership, policy snapshot, each unique transaction_id and
        contiguous device sequence. Compute charges on server; never accept
        balance or amount from client. Lock the wallet and commit the full
        batch, ledger entries, reserve reduction and sync response atomically. A
        sync does not automatically release expired allowances or create a
        replacement lease. Delayed/uncertain usage requires explicit
        reconciliation policy.
  /wallet/history:
    get:
      operationId: readOfflineWalletHistory
      summary: Read only the authenticated license history
      tags:
        - Wallet
      responses:
        "200":
          description: Successful operation. Balances are integer tokens, not currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "401":
          description: Missing, expired or revoked device credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Inactive user/license/wallet, unconfirmed device or ownership
            mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, insufficient funds, reused ID with changed body,
            duplicate transaction in a different batch, or invalid sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid request or policy limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Feature disabled or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 500
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      description: Existing confirmed device credential (not an email or raw machine
        ID). Store only its hash on the server. Website login continues to use
        existing Sanctum session and CSRF.
  schemas:
    Wallet:
      type: object
      additionalProperties: false
      required:
        - license_id
        - available_balance
        - reserved_balance
        - status
        - version
      properties:
        license_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        available_balance:
          type: integer
          minimum: 0
          maximum: 2147483647
        reserved_balance:
          type: integer
          minimum: 0
          maximum: 2147483647
        status:
          type: string
          enum:
            - active
            - blocked
            - closed
        version:
          type: integer
          minimum: 0
          maximum: 2147483647
    Policy:
      type: object
      additionalProperties: false
      required:
        - version
        - max_allowance
        - lease_seconds
        - sync_interval_seconds
        - first_online_activation_required
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        max_allowance:
          type: integer
          minimum: 1
          maximum: 2147483647
        lease_seconds:
          type: integer
          minimum: 1
          maximum: 2147483647
        sync_interval_seconds:
          type: integer
          minimum: 1
          maximum: 2147483647
        first_online_activation_required:
          type: boolean
          const: true
    Lease:
      type: object
      additionalProperties: false
      required:
        - id
        - device_id
        - allowance
        - policy
        - issued_at
        - sync_due_at
        - expires_at
        - grant
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        allowance:
          type: integer
          minimum: 1
          maximum: 2147483647
        policy:
          $ref: "#/components/schemas/Policy"
        issued_at:
          type: string
          format: date-time
        sync_due_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        grant:
          type: string
          description: Server-signed grant bound to license, device, lease, allowance,
            immutable pricing policy, expiry and signing key ID. No signing key
            is exposed.
    Usage:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - sequence
        - command
        - units
        - occurred_at
      properties:
        transaction_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          maximum: 2147483647
        command:
          type: string
          minLength: 1
          maxLength: 80
        units:
          type: integer
          minimum: 1
          maximum: 10000
        occurred_at:
          type: string
          format: date-time
          description: Client-reported audit timestamp, never trusted as proof of
            eligibility or pricing.
    ConnectRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - expected_version
        - requested_allowance
      properties:
        request_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        requested_allowance:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Also bounded by configured policy and current available balance.
    ConnectResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - wallet
            - lease
          properties:
            wallet:
              $ref: "#/components/schemas/Wallet"
            lease:
              $ref: "#/components/schemas/Lease"
    BalanceResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - wallet
            - server_time
            - last_sync_at
          properties:
            wallet:
              $ref: "#/components/schemas/Wallet"
            server_time:
              type: string
              format: date-time
            last_sync_at:
              type:
                - string
                - "null"
              format: date-time
    SyncRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - lease_id
        - expected_version
        - transactions
      properties:
        request_id:
          type: string
          format: uuid
        lease_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Usage"
          description: Runtime max_batch_size may be lower. Ordered, contiguous sequence;
            whole batch succeeds or fails.
    SyncResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - sync_id
            - request_id
            - status
            - accepted_transaction_ids
            - last_sequence
            - wallet
            - lease_remaining
            - server_time
          properties:
            sync_id:
              type: string
              format: uuid
            request_id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - accepted
            accepted_transaction_ids:
              type: array
              items:
                type: string
                format: uuid
            last_sequence:
              type: integer
              minimum: 0
              maximum: 2147483647
            wallet:
              $ref: "#/components/schemas/Wallet"
            lease_remaining:
              type: integer
              minimum: 0
              maximum: 2147483647
            server_time:
              type: string
              format: date-time
    Entry:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - type
        - amount
        - source
        - device_id
        - created_by
        - created_at
      properties:
        transaction_id:
          type:
            - string
            - "null"
          format: uuid
          description: Null for legacy rows only; required for every Phase 2 write.
        type:
          type: string
          enum:
            - credit
            - debit
        amount:
          type: integer
          minimum: 0
          maximum: 2147483647
        source:
          type:
            - string
            - "null"
        device_id:
          type:
            - integer
            - "null"
        created_by:
          type:
            - integer
            - "null"
          description: Actor user ID when applicable; no private user profile or secrets.
        created_at:
          type: string
          format: date-time
    HistoryResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        meta:
          type: object
          additionalProperties: false
          required:
            - next_cursor
          properties:
            next_cursor:
              type:
                - string
                - "null"
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
